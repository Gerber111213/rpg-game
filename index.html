<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawler Carl - Floor 1</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HUD Overlay -->
  <div id="ui-overlay">
    <div class="hud-header">SYSTEM AI STATUS</div>
    <div class="hud-body">
      <div class="stat-group">
        <h4>Crawler: Carl</h4>
        <p>HP: <span id="hp">100</span>/100</p>
        <p>Footwear: <span class="highlight-danger">NONE (Barefoot)</span></p>
      </div>
      <hr>
      <div class="stat-group">
        <h4>Companion: Donut</h4>
        <p>Spell: <span class="highlight-magic">Magic Missile</span></p>
      </div>
      <hr>
      <div id="log-box">
        <p class="sys-msg">[SYSTEM AI]: Floor 1 labyrinth active. Explore carefully.</p>
      </div>
    </div>
  </div>

  <!-- Context Menu -->
  <div id="context-menu" class="hidden">
    <div id="context-header">Action Menu</div>
    <ul id="context-options"></ul>
  </div>

  <!-- Single Game Script -->
  <script src="game.js"></script>
</body>
</html>
