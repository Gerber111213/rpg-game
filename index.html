<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawler Carl - Fan RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Game World Canvas -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Side Interface Panel (RuneScape Style) -->
    <div id="ui-panel">
      <div id="stats-section">
        <h3>Crawler Stats</h3>
        <p>Health: <span id="hp">100</span>/100</p>
        <p>Strength: <span id="str">1</span></p>
        <p>Agility: <span id="agi">1</span></p>
      </div>
      <hr>
      <div id="inventory-section">
        <h3>Inventory</h3>
        <div class="inventory-grid">
          <div class="slot">Box of Extra Spicy Surprises</div>
          <div class="slot">Empty</div>
          <div class="slot">Empty</div>
          <div class="slot">Empty</div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
<!-- Custom RuneScape Right-Click Menu -->
<div id="context-menu" class="hidden">
  <div id="context-header">Options</div>
  <ul id="context-options"></ul>
</div>
</body>
</html>
